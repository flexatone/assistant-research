name: Daily Research Digest

on:
  schedule:
    # 07:17 UTC: 12:17 AM Pacific during daylight saving, 11:17 PM the previous
    # evening in winter. GitHub often starts scheduled runs hours late (5-7h
    # observed in Sep 2026), so scheduling overnight still lands the digest by
    # morning. Monday through Friday (UTC) only; off the top of the hour, when
    # GitHub's scheduler is busiest.
    - cron: '17 7 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install .

      - name: Generate, email digest, and record articles
        env:
          # Needs PAT with repo scope to read activity across all repos
          USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: python main.py digest --send-email --post-issue
