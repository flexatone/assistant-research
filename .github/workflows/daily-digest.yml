name: Daily Research Digest

on:
  schedule:
    # 6:00 AM Pacific (14:00 UTC) - runs at 7:00 AM during daylight saving
    # Monday through Friday only
    - cron: '0 14 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install .

      - name: Generate, email digest, and record articles
        env:
          # Needs PAT with repo scope to read activity across all repos
          USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: python main.py digest --send-email --post-issue
