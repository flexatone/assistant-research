[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-research"
version = "0.1.0"
description = "Research assistant for personalized article digests"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.2.1",
    "anthropic==0.76.0",
    "feedparser==6.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
